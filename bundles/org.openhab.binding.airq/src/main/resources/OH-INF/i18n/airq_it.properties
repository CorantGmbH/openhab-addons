# add-on

addon.airq.name = Binding air-Q
addon.airq.description = Questo è il gestore per i dispositivi air-Q. Il dispositivo air-Q contiene diversi sensori che misurano i gas nell'aria e altri parametri atmosferici come il rumore o la temperatura. Con questa associazione puoi integrare questi valori nel tuo sistema openHAB e cambiare i parametri del dispositivo air Q.

